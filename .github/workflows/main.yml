name: Build Scarlet Skips

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update devkitPro package database
        run: |
          dkp-pacman -Sy --noconfirm

      - name: Install 3DS development packages
        run: |
          dkp-pacman -S --needed --noconfirm \
            devkitARM \
            libctru \
            citro3d \
            citro2d \
            3dstools

      - name: Verify 3DS libraries
        run: |
          echo "=== Toolchain ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "=== Libraries ==="
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          test -f "$DEVKITPRO/portlibs/3ds/lib/libcitro3d.a"
          test -f "$DEVKITPRO/portlibs/3ds/lib/libcitro2d.a"

          echo "libctru OK"
          echo "citro3d OK"
          echo "citro2d OK"

          echo "=== Tools ==="
          command -v arm-none-eabi-gcc
          command -v 3dsxtool

      - name: Install bannertool
        run: |
          wget -q \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip \
            -O bannertool.zip

          unzip -j bannertool.zip \
            linux-x86_64/bannertool \
            -d /opt/devkitpro/tools/bin

          chmod +x /opt/devkitpro/tools/bin/bannertool

      - name: Install makerom
        run: |
          wget -q \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip \
            -O makerom.zip

          unzip -j makerom.zip \
            makerom \
            -d /opt/devkitpro/tools/bin

          chmod +x /opt/devkitpro/tools/bin/makerom

      - name: Verify packaging tools
        run: |
          command -v bannertool
          command -v makerom
          bannertool --help || true
          makerom -h || true

      - name: Build Scarlet Skips
        run: |
          make clean
          make

      - name: Verify output
        run: |
          echo "=== Build output ==="
          ls -lh ScarletSkips.*

          test -f ScarletSkips.cia
          test -f ScarletSkips.3dsx
          test -f ScarletSkips.smdh

          echo "CIA created successfully!"
          echo "3DSX created successfully!"
          echo "SMDH created successfully!"

      - name: Upload Scarlet Skips
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Skips-3DS
          path: |
            ScarletSkips.cia
            ScarletSkips.3dsx
            ScarletSkips.smdh
          if-no-files-found: error
